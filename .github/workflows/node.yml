name: Node CI
on:
  push:
    branches:
      - master
permissions:
  contents: write
jobs:
  release:
    name: Build, test, and release
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Cache node modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        env:
          cache-name: cache-node-modules
        with:
          path: ~/.npm
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
            ${{ runner.os }}-build-
            ${{ runner.os }}-
      - name: Install dependencies
        run: npm ci
      - name: Build TypeScript
        run: npm run build
      - name: Run tests
        run: npm run test
      - name: Check if a release is required
        id: release-check
        run: |
          node <<'NODE'
          const fs = require("fs");
          const semanticRelease = require("semantic-release");
          semanticRelease({ dryRun: true, ci: false })
            .then((result) => {
              fs.appendFileSync(
                process.env.GITHUB_OUTPUT,
                `required=${Boolean(result)}\n`
              );
            })
            .catch((error) => {
              console.error(error);
              process.exit(1);
            });
          NODE
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
      - name: Release
        if: steps.release-check.outputs.required == 'true'
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          GIT_AUTHOR_NAME: "Stethoscoper"
          GIT_AUTHOR_EMAIL: "stethoscope-js@anandchowdhary.com"
          GIT_COMMITTER_NAME: "Stethoscoper"
          GIT_COMMITTER_EMAIL: "stethoscope-js@anandchowdhary.com"
