name: Node CI
on:
  push:
    branches:
      - master
jobs:
  validate:
    name: Build and test
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    permissions:
      contents: read
    outputs:
      release-required: ${{ steps.release-check.outputs.required }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Cache node modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        env:
          cache-name: cache-node-modules
        with:
          path: ~/.npm
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
            ${{ runner.os }}-build-
            ${{ runner.os }}-
      - name: Install dependencies
        run: npx --yes npm@11.19.1 ci
      - name: Build TypeScript
        run: npm run build
      - name: Run tests
        run: npm run test
      - name: Check if a release is required
        id: release-check
        run: |
          node <<'NODE'
          const fs = require("fs");
          const semanticRelease = require("semantic-release").default;
          const config = require("./release.config");
          const analyzer = config.plugins.find(
            (plugin) => Array.isArray(plugin) && plugin[0] === "semantic-release-gitmoji"
          );
          semanticRelease({
            dryRun: true,
            ci: false,
            repositoryUrl: `file://${process.cwd()}`,
            plugins: [analyzer],
          })
            .then((result) => {
              fs.appendFileSync(
                process.env.GITHUB_OUTPUT,
                `required=${Boolean(result)}\n`
              );
            })
            .catch((error) => {
              console.error(error);
              process.exit(1);
            });
          NODE
  release:
    name: Release
    needs: validate
    if: needs.validate.outputs.release-required == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Install dependencies
        run: npx --yes npm@11.19.1 ci
      - name: Build TypeScript
        run: npm run build
      - name: Release
        run: npx --yes npm@11.19.1 exec -- semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          GIT_AUTHOR_NAME: "Stethoscoper"
          GIT_AUTHOR_EMAIL: "stethoscope-js@anandchowdhary.com"
          GIT_COMMITTER_NAME: "Stethoscoper"
          GIT_COMMITTER_EMAIL: "stethoscope-js@anandchowdhary.com"
