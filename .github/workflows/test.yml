name: Test CI
on:
  pull_request:
    branches:
      - master
  push:
    branches-ignore:
      - master
permissions:
  contents: read
jobs:
  release:
    name: Build and test
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Install dependencies
        run: npx --yes npm@11.19.1 ci
      - name: Build TypeScript
        run: npm run build
      - name: Run tests
        run: npm run test
      - name: Validate release modules
        run: |
          node <<'NODE'
          const semanticRelease = require("semantic-release").default;
          const config = require("./release.config");
          if (typeof semanticRelease !== "function") {
            throw new TypeError("semantic-release JS API is unavailable");
          }
          Promise.all(
            config.plugins.map((plugin) =>
              import(Array.isArray(plugin) ? plugin[0] : plugin)
            )
          ).catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE
